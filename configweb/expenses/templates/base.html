<!DOCTYPE html>
<html>
<head>

    <title>SnapExpense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark p-3">
    <div class="container">
        <a class="navbar-brand" href="/">SnapExpense </a>
        <div>
            {% if user.is_authenticated %}
            <a href="/expenses/" class="btn btn-light"> Expenses </a>

            <a href="/add/" class="btn btn-warning">Add Expense</a>

            <a href="/logout/" class="btn btn-danger"> Logout </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>
</body>
</html>
