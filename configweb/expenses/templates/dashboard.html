{% extends 'base.html' %}

{% block content %}

<h2>Monthly Dashboard</h2>
<h4>Total Spent: ₹ {{ total }}</h4>
<canvas id="expenseChart"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('expenseChart');
new Chart(ctx, {
    type: 'pie',
    data: {
        labels: {{ categories|safe }},
        datasets: [{
            data: {{ amounts|safe }},
        }]
    }
});
</script>
{% endblock %}
